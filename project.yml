name: CMFBattery
options:
  bundleIdPrefix: com.example
targets:
  CMFBattery:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.cmfbattery
        PRODUCT_NAME: CMFBattery
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Buds Battery"
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "Serve per leggere la batteria delle tue cuffie."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: NO
